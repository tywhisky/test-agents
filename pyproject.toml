[project]
name = "test-agent"
version = "0.1.0"
description = "A beginner-friendly playground for learning Python agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.40.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "tavily-python>=0.7.25",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
